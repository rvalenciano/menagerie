# Load-testing overlay. Run alongside docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.bench.yml \
#     up --build --abort-on-container-exit vegeta-load-balancer
#   docker compose -f docker-compose.yml -f docker-compose.bench.yml \
#     up --build --abort-on-container-exit vegeta-rate-limiter
#   docker compose -f docker-compose.yml -f docker-compose.bench.yml \
#     up --build --abort-on-container-exit bench-ttl-cache
#
# All three are pure-Go load-testing tools (from each project's own
# benchmark/bench folder) firing sustained load at the real,
# already-running service over the shared `labnet` network. The first
# two speak HTTP via vegeta; ttl-cache speaks its own line-based TCP
# protocol, so it gets a small hand-rolled Go client instead.
services:
  vegeta-load-balancer:
    build:
      context: ./go-load-balancer/benchmark
    depends_on:
      - load-balancer
    command: ["${RATE:-200}", "${DURATION:-30s}", "http://load-balancer:8080/"]
    networks:
      - labnet

  vegeta-rate-limiter:
    build:
      context: ./rate-limiter/benchmark
    depends_on:
      - rate-limiter
    command: ["${RATE:-200}", "${DURATION:-30s}", "http://rate-limiter:3000/"]
    networks:
      - labnet

  bench-ttl-cache:
    build:
      context: ./ttl-cache
      dockerfile: Dockerfile.bench
    depends_on:
      - ttl-cache
    command: ["-host", "ttl-cache", "-port", "6380", "-clients", "${CLIENTS:-20}", "-duration", "${DURATION:-5s}"]
    networks:
      - labnet
